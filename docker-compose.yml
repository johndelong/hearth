# The host runs a published image — no source checkout, no build toolchain, no
# git. This file plus a .env is the whole installation.
#
# To build from source instead (developing, or a change you haven't tagged):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  hearth:
    # update.sh sets APP_VERSION to the release tag it is installing.
    image: ${HEARTH_IMAGE:-ghcr.io/johndelong/hearth}:${APP_VERSION:-latest}
    container_name: hearth
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - hearth-data:/data
      # How the dashboard reaches the host's update agent: it writes a request
      # here, the agent writes back what happened. Harmless when no agent is
      # installed — the directory is simply empty and the button stays hidden.
      - ${HEARTH_CONTROL_DIR:-./.hearth-control}:/control
    environment:
      # Timezone drives chore resets and the day view, so set it to local time.
      TZ: ${TZ:-UTC}
      # The address tablets use. Google redirects back here after sign-in, so it
      # must match the redirect URI registered in the Google Cloud console.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      # Optional: only raises GitHub's rate limit for the release check.
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
      UPDATE_REPO: ${UPDATE_REPO:-johndelong/hearth}
      # Optional low-latency Rhys voice satellite. The API uses this server-side
      # token to mint short-lived browser session tokens; it is never exposed
      # to the tablet.
      VOICE_GATEWAY_URL: ${VOICE_GATEWAY_URL:-}
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:-}

volumes:
  hearth-data:
