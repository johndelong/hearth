services:
  hearth:
    build:
      context: .
      args:
        # deploy.sh sets this from `git describe`; defaults to dev otherwise.
        APP_VERSION: ${APP_VERSION:-dev}
    image: hearth:latest
    container_name: hearth
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - hearth-data:/data
    environment:
      # Timezone drives chore resets and the day view, so it must be local time.
      TZ: America/Detroit
      # The address tablets use. Google redirects back here after sign-in, so it
      # must match the redirect URI registered in the Google Cloud console.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      # Optional: a read-only token lets the dashboard notice new releases.
      # Without it the app still detects stale tabs after a deploy.
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
      UPDATE_REPO: ${UPDATE_REPO:-johndelong/hearth}

volumes:
  hearth-data:
