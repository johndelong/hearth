name: Hearth checks

on:
  push:
  pull_request:

jobs:
  hearth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@dashboard/shared
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
