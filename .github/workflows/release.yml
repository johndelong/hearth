name: Release

# Pushing a tag is the whole workflow: `git tag v0.2.0 && git push --tags`.
# GitHub then builds and publishes the image the houses pull, and publishes the
# Release, which is what the dashboard's update notice reads — a bare tag is
# invisible to the releases API.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Never publish a release that doesn't build. A bad tag would otherwise cost
  # a failed update on the machine serving the house to discover.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@dashboard/shared
      - run: npm run typecheck
      - run: npm run build

  # The image the houses actually run. Built here so no host needs a checkout,
  # git, or a build toolchain — installing an update is a pull.
  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # arm64 for Apple silicon, amd64 for everything else. The build is npm and
      # tsc with no native modules, so emulating the other architecture costs
      # time and nothing else — not worth a second runner to avoid.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          # `latest` is what a first install pulls; the tag is what update.sh
          # asks for by name, so a rollback can name an older one.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Last, so a published Release always has an image behind it. The dashboard
    # offers an update the moment the Release appears.
    needs: [check, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the generated notes can diff against the last tag.
          fetch-depth: 0
      # Prefer GitHub's own notes: when work arrives through pull requests they
      # are categorised and linked, which a commit list cannot match. But they
      # are built *from* pull requests, so commits pushed straight to main
      # produce nothing but a compare link. Fall back to commit subjects only
      # in that case.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          if [ -n "$previous" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f previous_tag_name="${previous}" -q .body > notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" -q .body > notes.md
          fi

          # GitHub lists pull requests as "* ...". No bullets means it found
          # none, so describe the commits instead and keep its compare link.
          if ! grep -qE '^\* ' notes.md; then
            range="${previous:+${previous}..}${GITHUB_REF_NAME}"
            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' "$range"
              echo
              cat notes.md
            } > notes.combined.md
            mv notes.combined.md notes.md
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
