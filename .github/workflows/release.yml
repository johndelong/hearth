name: Release

# Pushing a tag is the whole workflow: `git tag v0.2.0 && git push --tags`.
# GitHub then publishes the Release, which is what the dashboard's update
# notice reads — a bare tag is invisible to the releases API.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Never publish a release that doesn't build. A bad tag would otherwise cost
  # a failed update on the machine serving the house to discover.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@dashboard/shared
      - run: npm run typecheck
      - run: npm run build

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the generated notes can diff against the last tag.
          fetch-depth: 0
      # Prefer GitHub's own notes: when work arrives through pull requests they
      # are categorised and linked, which a commit list cannot match. But they
      # are built *from* pull requests, so commits pushed straight to main
      # produce nothing but a compare link. Fall back to commit subjects only
      # in that case.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          if [ -n "$previous" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f previous_tag_name="${previous}" -q .body > notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" -q .body > notes.md
          fi

          # GitHub lists pull requests as "* ...". No bullets means it found
          # none, so describe the commits instead and keep its compare link.
          if ! grep -qE '^\* ' notes.md; then
            range="${previous:+${previous}..}${GITHUB_REF_NAME}"
            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' "$range"
              echo
              cat notes.md
            } > notes.combined.md
            mv notes.combined.md notes.md
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
